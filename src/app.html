<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

<style>
	:root {
		/* light theme palette */
		--white: #FAFAFA;
		--blue: #2868F0;

		/* dark theme palette */
		--black: #252728;
		--green: #86CF86;
	}

	html {
		color-scheme: light dark;

		--background: light-dark(var(--white), var(--black));
		--background-reverse: light-dark(var(--black), var(--white));
		--text-primary: light-dark(var(--black), var(--white));
		--text-secondary: light-dark(var(--blue), var(--green));
	}

	html, body {
		margin: 0;
		padding: 0;
		background-color: var(--background);
	}
</style>
